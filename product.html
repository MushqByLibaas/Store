<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .similar-container { max-width: 1100px; margin: 0 auto 40px auto; padding: 15px; }
        
        /* Mobile Horizontal Slider Override */
        @media (max-width: 768px) {
            #similarProductsGrid {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                gap: 12px !important;
                padding: 10px 0 !important;
                -webkit-overflow-scrolling: touch !important;
                scrollbar-width: none !important;
            }
            #similarProductsGrid::-webkit-scrollbar { display: none; }
            #similarProductsGrid .product-card {
                flex: 0 0 170px !important;
                min-width: 170px !important;
            }
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
        }
        .card-title { font-size: 13px; font-weight: 600; margin: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-price { font-size: 14px; font-weight: bold; color: var(--accent-gold); }
    </style>
</head>
<body>

    <div class="similar-container">
        <h2 style="color: var(--accent-gold);">✨ Similar Products</h2>
        <div class="product-grid" id="similarProductsGrid">
            <!-- Products will load here -->
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCQU5IqB0wStcqvnetheOcv2oVnD-RoXw",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.firebasestorage.app",
            messagingSenderId: "1057698747540",
            appId: "1:1057698747540:web:e68337039fcb254f381081"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loadSimilarProducts() {
            const grid = document.getElementById('similarProductsGrid');
            db.collection("products").get().then((snapshot) => {
                let html = '';
                snapshot.forEach((doc) => {
                    const p = doc.data();
                    const img = (p.images && p.images[0]) ? p.images[0] : (p.image || 'https://via.placeholder.com/300');
                    html += `
                        <div class="product-card" onclick="window.location.href='product.html?id=${doc.id}'">
                            <img src="${img}" alt="${p.title}" loading="lazy">
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">₹${p.price}</div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            });
        }
        loadSimilarProducts();
    </script>
</body>
</html>
