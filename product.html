<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - MushqByLibaas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: #18181c;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .gallery-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .main-img-wrap {
            width: 100%;
            height: 450px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .main-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumbnail-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .thumb-img {
            width: 80px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #333;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .thumb-img:hover, .thumb-img.active {
            border-color: var(--accent-gold, #d4af37);
        }
        .product-info-box h1 {
            font-family: 'Cinzel', serif;
            color: var(--text-color, #fff);
            font-size: 26px;
            margin-bottom: 10px;
        }
        .product-info-box .price {
            font-size: 24px;
            color: var(--accent-gold, #d4af37);
            font-weight: bold;
            margin-bottom: 20px;
        }
        .option-group {
            margin-bottom: 20px;
        }
        .option-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .chips-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .chip {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .chip.selected {
            background: var(--accent-gold, #d4af37);
            color: #000;
            border-color: var(--accent-gold, #d4af37);
            font-weight: bold;
        }
        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .action-btns button {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .add-cart-btn {
            background: #111;
            color: #fff;
            border: 1px solid var(--accent-gold, #d4af37);
        }
        .order-now-btn {
            background: var(--accent-gold, #d4af37);
            color: #000;
            border: none;
        }
        @media(max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 10px;
                padding: 15px;
            }
            .main-img-wrap {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">MUSK BY <span>LIBAAS</span></a>
        <div class="cart-trigger" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-house"></i> Home
        </div>
    </header>

    <div class="product-detail-container" id="productDetailContainer">
        <p style="color: #aaa; text-align: center; grid-column: 1 / -1; padding: 40px;">Loading product details...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCQU5IqB0wStcqvnetheOcv2oVnD-RoXw",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.firebasestorage.app",
            messagingSenderId: "1057698747540",
            appId: "1:1057698747540:web:e68337039fcb254f381081",
            measurementId: "G-J1L758MD9G"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let selectedColor = '';
        let selectedSize = '';
        let currentProduct = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('productDetailContainer').innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Product not found!</p>';
                return;
            }

            db.collection("products").doc(productId).get().then((doc) => {
                if (doc.exists) {
                    currentProduct = doc.data();
                    renderProduct(currentProduct);
                } else {
                    document.getElementById('productDetailContainer').innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Product does not exist.</p>';
                }
            }).catch(err => {
                document.getElementById('productDetailContainer').innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Error: ${err.message}</p>`;
            });
        });

        function renderProduct(p) {
            const container = document.getElementById('productDetailContainer');
            
            // Images array handle karna (agar multiple images hain ya ek hi hai)
            let images = [];
            if (p.images && Array.isArray(p.images) && p.images.length > 0) {
                images = p.images;
            } else if (p.image) {
                images = [p.image, p.image, p.image]; // Slider feel dene ke liye agar single image ho
            } else {
                images = ['https://via.placeholder.com/400'];
            }

            let thumbHtml = '';
            images.forEach((img, index) => {
                thumbHtml += `<img src="${img}" class="thumb-img ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">`;
            });

            // Colors setup
            let colors = p.colors || ['Maroon', 'Black', 'Navy Blue', 'Pink'];
            if (typeof colors === 'string') colors = colors.split(',').map(s => s.trim());
            selectedColor = colors[0];

            let colorHtml = '';
            colors.forEach((col, idx) => {
                colorHtml += `<div class="chip ${idx === 0 ? 'selected' : ''}" onclick="selectOption('color', '${col}', this)">${col}</div>`;
            });

            // Sizes setup
            let sizes = p.sizes || ['S', 'M', 'L', 'XL', 'XXL'];
            if (typeof sizes === 'string') sizes = sizes.split(',').map(s => s.trim());
            selectedSize = sizes[0];

            let sizeHtml = '';
            sizes.forEach((sz, idx) => {
                sizeHtml += `<div class="chip ${idx === 0 ? 'selected' : ''}" onclick="selectOption('size', '${sz}', this)">${sz}</div>`;
            });

            container.innerHTML = `
                <div class="gallery-box">
                    <div class="main-img-wrap">
                        <img id="mainProductImg" src="${images[0]}" alt="${p.title}">
                    </div>
                    <div class="thumbnail-row">
                        ${thumbHtml}
                    </div>
                </div>
                <div class="product-info-box">
                    <h1>${p.title}</h1>
                    <div class="price">₹${p.price}</div>
                    
                    <div class="option-group">
                        <label>Select Color:</label>
                        <div class="chips-row">${colorHtml}</div>
                    </div>

                    <div class="option-group">
                        <label>Select Size:</label>
                        <div class="chips-row">${sizeHtml}</div>
                    </div>

                    <div class="action-btns">
                        <button class="add-cart-btn" onclick="addToCartDetail()"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                        <button class="order-now-btn" onclick="orderNowDetail()"><i class="fa-solid fa-bolt"></i> Order Now</button>
                    </div>
                </div>
            `;
        }

        function changeMainImage(imgSrc, thumbElement) {
            document.getElementById('mainProductImg').src = imgSrc;
            document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function selectOption(type, value, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.chip').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            if (type === 'color') selectedColor = value;
            if (type === 'size') selectedSize = value;
        }

        function addToCartDetail() {
            if (!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            const customTitle = `${currentProduct.title} (${selectedColor}, ${selectedSize})`;
            
            let existing = cart.find(item => item.title === customTitle);
            const mainImg = currentProduct.image || 'https://via.placeholder.com/150';

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    title: customTitle,
                    price: currentProduct.price,
                    image: mainImg,
                    qty: 1
                });
            }
            localStorage.setItem('novaCart', JSON.stringify(cart));
            alert("Product added to cart successfully!");
        }

        function orderNowDetail() {
            if (!currentProduct) return;
            const customTitle = `${currentProduct.title} (${selectedColor}, ${selectedSize})`;
            const mainImg = currentProduct.image || 'https://via.placeholder.com/150';

            const buyNowItem = [{
                title: customTitle,
                price: currentProduct.price,
                image: mainImg,
                qty: 1
            }];
            localStorage.setItem('novaCart', JSON.stringify(buyNowItem));
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
