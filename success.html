<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - MuskByLibaas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#0f0f0f; font-family:'Poppins', sans-serif;">

    <div style="background:var(--card-bg, #1a1a1a); padding:35px 25px; border-radius:16px; border:1px solid var(--accent-gold, #d4af37); text-align:center; max-width:450px; width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        
        <div style="font-size:60px; color:#f39c12; margin-bottom:15px;">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>

        <h2 style="color:#fff; margin-bottom:10px; font-size:22px;">Order Placed Successfully!</h2>
        <div style="display:inline-block; background:rgba(243, 156, 18, 0.15); color:#f39c12; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-bottom:20px; border:1px solid rgba(243, 156, 18, 0.3);">
            Status: Pending Payment Verification
        </div>

        <p style="color:#bbb; font-size:14px; line-height:1.6; margin-bottom:25px;">
            Thank you for shopping with <strong style="color:var(--accent-gold, #d4af37);">MuskByLibaas</strong>! We have received your order details. Our team will verify your UPI payment screenshot/transaction within a few hours, and your order will be dispatched within 2-3 days.
        </p>

        <a href="index.html" style="display:block; background:var(--accent-gold, #d4af37); color:#000; text-decoration:none; padding:14px; font-weight:bold; border-radius:8px; text-transform:uppercase; font-size:14px; transition:0.3s;">
            <i class="fa-solid fa-store"></i> Return to Homepage
        </a>
    </div>

</body>
</html>
