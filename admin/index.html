<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Store - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0b0b0d; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
        .login-box, .admin-panel { max-width: 800px; margin: 40px auto; background: #18181c; padding: 25px; border-radius: 10px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #d4af37; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .order-card { background: #222; border-left: 4px solid #d4af37; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-box">
        <h2 style="color: #d4af37; text-align: center;">Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="checkLogin()">Login</button>
    </div>

    <!-- Admin Panel Screen -->
    <div id="adminPanel" class="admin-panel hidden">
        <h2 style="color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px;">Live Store Orders</h2>
        <div id="ordersContainer">
            <p style="color: #888;">Loading orders from database...</p>
        </div>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'mushq123') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadOrders();
            } else {
                alert('Wrong Password!');
            }
        }

        function loadOrders() {
            // Aapka Firebase load logic yahan aayega, ya aap direct Firebase console check kar sakte hain.
            document.getElementById('ordersContainer').innerHTML = '<p>Connected! Check your Firebase Console "orders" collection to see live incoming orders instantly.</p>';
        }
    </script>
</body>
</html>
