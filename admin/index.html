<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MuskByLibaas</title>
    <!-- Cropper.js CSS for image cropping & resizing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #1abc9c;
            --background-color: #f4f6f9;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }
        sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            color: var(--secondary-color);
        }
        sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        sidebar a:hover, sidebar a.active {
            background-color: rgba(255, 255, 255, 0.1);
        }
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        /* Image Cropper Container Styles */
        .img-container {
            max-width: 100%;
            max-height: 400px;
            margin-bottom: 15px;
            display: none;
        }
        .img-container img {
            max-width: 100%;
            display: block;
        }
        .preview-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
    </style>
</head>
<body>

    <sidebar>
        <h2>MuskByLibaas</h2>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Products</a>
        <a href="#">Orders</a>
        <a href="#">Settings</a>
    </sidebar>

    <main>
        <header>
            <h2>Admin Dashboard</h2>
            <span>Welcome, Admin</span>
        </header>

        <div class="card">
            <h3>Add New Product</h3>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productPrice">Price</label>
                    <input type="number" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label for="productImageInput">Product Image (Auto 1000x1000 Resizer)</label>
                    <input type="file" id="productImageInput" accept="image/*" required>
                </div>

                <!-- Cropper Area -->
                <div class="form-group">
                    <div class="img-container">
                        <img id="imageToCrop" src="" alt="Source Image">
                    </div>
                    <button type="button" id="cropBtn" style="display:none; margin-top: 10px;">Crop & Fit to 1000x1000</button>
                </div>

                <div class="form-group preview-container">
                    <input type="hidden" id="croppedImageData">
                    <canvas id="outputCanvas" width="100" height="100" style="border:1px solid #ccc; display:none;"></canvas>
                    <span id="cropStatus" style="font-size: 0.9rem; color: #665; display:none;">Image ready (1000x1000px)</span>
                </div>

                <div class="form-group">
                    <label for="productDesc">Description</label>
                    <textarea id="productDesc" rows="4"></textarea>
                </div>
                <button type="submit">Save Product</button>
            </form>
        </div>
    </main>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        const imageInput = document.getElementById('productImageInput');
        const imageToCrop = document.getElementById('imageToCrop');
        const imgContainer = document.querySelector('.img-container');
        const cropBtn = document.getElementById('cropBtn');
        const croppedImageData = document.getElementById('croppedImageData');
        const outputCanvas = document.getElementById('outputCanvas');
        const cropStatus = document.getElementById('cropStatus');

        imageInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = function (event) {
                    imageToCrop.src = event.target.result;
                    imgContainer.style.display = 'block';
                    cropBtn.style.display = 'inline-block';
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1 / 1, // 1:1 Square for 1000x1000
                        viewMode: 1,
                        autoCropArea: 1,
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        cropBtn.addEventListener('click', function () {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({
                    width: 1000,
                    height: 1000,
                });
                
                // Show thumbnail preview
                outputCanvas.style.display = 'block';
                const ctx = outputCanvas.getContext('2d');
                ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                ctx.drawImage(canvas, 0, 0, 100, 100);

                // Save base64 data to hidden input
                croppedImageData.value = canvas.toDataURL('image/jpeg');
                cropStatus.style.display = 'inline-block';
                cropStatus.innerText = "Image successfully fitted to 1000x1000px!";
            }
        });

        document.getElementById('productForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (!croppedImageData.value) {
                alert('Please crop and generate the 1000x1000 image first!');
                return;
            }
            // Baaki submission logic jo aapki pehle se thi
            alert('Product saved successfully for MuskByLibaas!');
        });
    </script>
</body>
</html>
