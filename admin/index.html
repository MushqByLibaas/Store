<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MuskByLibaas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body style="background:#0f0f0f; color:#fff; font-family:'Poppins', sans-serif; padding:20px;">

    <div style="max-width: 700px; margin: 0 auto;">
        
        <!-- Top Navigation Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--accent-gold, #d4af37); margin: 0;">Admin Orders</h2>
            <button onclick="logoutAdmin()" style="background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

        <!-- Bulk Actions Bar for Orders Deletion -->
        <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div>
                <label style="cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)" style="width: 18px; height: 18px; accent-color: var(--accent-gold, #d4af37);"> 
                    <span>Select All Orders</span>
                </label>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="deleteSelectedOrders()" style="background: #c0392b; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
                    <i class="fa-solid fa-trash"></i> Delete Selected
                </button>
                <button onclick="loadOrders()" style="background: #333; color: var(--accent-gold, #d4af37); border: 1px solid var(--accent-gold, #d4af37); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer">
            <p style="text-align: center; color: #888;">Loading orders...</p>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR_API_KEY_HERE",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            loadOrders();
        });

        function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<p style="text-align: center; color: #888;">Loading orders...</p>';

            db.collection("orders").get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; color: #888; padding: 30px;">No customer orders found. Database is clean!</p>';
                    return;
                }

                let html = "";
                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    const orderId = doc.id;
                    
                    let itemsList = "";
                    if (order.items && Array.isArray(order.items)) {
                        order.items.forEach(item => {
                            itemsList += `<li style="margin-left: 20px; font-size: 13px; color: #ccc;">${item.title} (Qty: ${item.qty}) - ₹${item.price * item.qty}</li>`;
                        });
                    }

                    html += `
                        <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; position: relative;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <input type="checkbox" class="order-checkbox" value="${orderId}" style="width: 18px; height: 18px; accent-color: var(--accent-gold, #d4af37);">
                                    <h3 style="color: var(--accent-gold, #d4af37); margin: 0; font-size: 16px;">Customer: ${order.customerName || 'N/A'}</h3>
                                </div>
                                <span style="background: #27ae60; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">₹${order.totalAmount || 0}</span>
                            </div>
                            <p style="margin: 5px 0; font-size: 13px; color: #aaa;"><strong>Phone:</strong> ${order.phone || 'N/A'}</p>
                            <p style="margin: 5px 0; font-size: 13px; color: #aaa;"><strong>Address:</strong> ${order.address || 'N/A'}</p>
                            <div style="margin: 5px 0; font-size: 13px; color: #aaa;"><strong>Items:</strong> <ul style="margin: 3px 0; padding: 0;">${itemsList}</ul></div>
                            <p style="margin: 5px 0 0 0; font-size: 11px; color: #666;">Date: ${order.orderDate || 'N/A'}</p>
                            
                            <!-- Single Delete Button -->
                            <button onclick="deleteSingleOrder('${orderId}')" style="position: absolute; bottom: 15px; right: 15px; background: transparent; border: none; color: #e74c3c; cursor: pointer; font-size: 14px;" title="Delete Order">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('selectAllCheckbox').checked = false;
            }).catch((error) => {
                container.innerHTML = `<p style="text-align: center; color: red;">Error loading orders: ${error.message}</p>`;
            });
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        function deleteSingleOrder(orderId) {
            if (confirm("Kya aap sach mein is order ko delete karna chahte hain?")) {
                db.collection("orders").doc(orderId).delete().then(() => {
                    loadOrders();
                }).catch(error => {
                    alert("Error deleting order: " + error.message);
                });
            }
        }

        function deleteSelectedOrders() {
            const checkboxes = document.querySelectorAll('.order-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Please select at least one order to delete!");
                return;
            }

            if (confirm(`Kya aap sach mein selected ${checkboxes.length} orders ko delete karna chahte hain?`)) {
                let promises = [];
                checkboxes.forEach(cb => {
                    promises.push(db.collection("orders").doc(cb.value).delete());
                });

                Promise.all(promises).then(() => {
                    loadOrders();
                }).catch(error => {
                    alert("Error deleting orders: " + error.message);
                });
            }
        }

        function logoutAdmin() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
