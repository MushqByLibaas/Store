<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushq Libaas | Premium Ladies Suits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        ✨ NO EXCHANGE / NO RETURN / NO CANCELLATION | Pan India Delivery ✨
    </div>

    <header class="header">
        <a href="index.html" class="logo">MUSHQ <span>LIBAAS</span></a>
    </header>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search Suits, Party Wear, Festive...">
        </div>

        <h2 class="section-title">NEW ARRIVALS</h2>
        <div class="product-grid" id="productGrid">
            <!-- Product Card with Direct Order Button -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500" alt="Suit" style="width:100%; height:300px; object-fit:cover; border-radius:6px; margin-bottom:12px;">
                <h3 style="font-size:14px; font-weight:600; margin-bottom:6px;">Winish Maroon Soft Cotton Suit</h3>
                <div style="color:var(--accent-gold); font-weight:bold; margin-bottom:12px;">₹2,499</div>
                <button onclick="directOrder('Winish Maroon Soft Cotton Suit', 2499)" style="background:var(--accent-gold); border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; text-transform:uppercase; letter-spacing:1px;">Order Now</button>
            </div>
        </div>
    </div>

    <script>
        function directOrder(title, price) {
            // Cart mein single item array daal kar seedha checkout bhej rahe hain
            const buyNowItem = [{
                title: title,
                price: price,
                qty: 1
            }];
            localStorage.setItem('novaCart', JSON.stringify(buyNowItem));
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
