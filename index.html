<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuskByLibaas | Exclusive Suits & Party Wear</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        ✨ NO EXCHANGE / NO RETURN / NO CANCELLATION | Pan India Delivery ✨
    </div>

    <header class="header">
        <a href="index.html" class="logo">MUSK BY <span>LIBAAS</span></a>
        <!-- Cart Trigger Button -->
        <div class="cart-trigger" onclick="toggleCartDrawer()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search Suits, Party Wear, Festive..." onkeyup="filterProducts()">
        </div>

        <h2 class="section-title">NEW ARRIVALS</h2>
        <div class="product-grid" id="productGrid">
            <p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Loading live products...</p>
        </div>
    </div>

    <!-- CART OVERLAY & DRAWER -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCartDrawer()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <button class="close-cart" onclick="toggleCartDrawer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal:</span>
                <span id="cartSubtotal">₹0</span>
            </div>
            <button class="checkout-btn" onclick="proceedToCheckout()">
                Proceed to Checkout ⚡
            </button>
        </div>
    </div>

    <!-- Firebase Configuration & Fast Optimized Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR_API_KEY_HERE",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            updateCartCount();
            loadLiveProducts();
        });

        function loadLiveProducts() {
            const grid = document.getElementById('productGrid');

            db.collection("products").get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1;">No products available at the moment.</p>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const colorsText = p.colors && Array.isArray(p.colors) ? p.colors.join(', ') : (p.colors || 'N/A');
                    const sizesText = p.sizes && Array.isArray(p.sizes) ? p.sizes.join(', ') : (p.sizes || 'N/A');
                    const safeImage = p.image || 'https://via.placeholder.com/300';
                    
                    html += `
                        <div class="product-card">
                            <img src="${safeImage}" alt="Suit" loading="lazy" onerror="this.src='https://via.placeholder.com/300'">
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price">₹${p.price}</div>
                            <div class="product-meta">Colors: ${colorsText}</div>
                            <div class="product-meta" style="margin-bottom:10px;">Sizes: ${sizesText}</div>
                            <div class="product-btn-group">
                                <button onclick="addToCart('${p.title.replace(/'/g, "\\'")}', ${p.price}, '${safeImage}')" style="flex:1; background:var(--input-bg); color:var(--text-color); border:1px solid var(--accent-gold); padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">🛒 Add to Cart</button>
                                <button onclick="directOrder('${p.title.replace(/'/g, "\\'")}', ${p.price}, '${safeImage}')" style="flex:1; background:var(--accent-gold); border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; color:#000;">⚡ Order Now</button>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            }).catch((error) => {
                grid.innerHTML = `<p style="color:red; text-align:center; grid-column: 1 / -1;">Error loading products: ${error.message}</p>`;
            });
        }

        function addToCart(title, price, image) {
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            let existing = cart.find(item => item.title === title);
            if (existing) {
                existing.qty += 1;
                existing.image = image; // Update image if missing
            } else {
                cart.push({ title: title, price: price, image: image, qty: 1 });
            }
            localStorage.setItem('novaCart', JSON.stringify(cart));
            updateCartCount();
            
            const badge = document.getElementById('cartCount');
            badge.style.transform = 'scale(1.3)';
            setTimeout(() => { badge.style.transform = 'scale(1)'; }, 200);
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
            if (drawer.classList.contains('open')) {
                renderCartItems();
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsContainer');
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Your cart is empty.</p>';
                document.getElementById('cartSubtotal').innerText = '₹0';
                return;
            }

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                let itemImg = item.image && item.image !== 'undefined' ? item.image : 'https://via.placeholder.com/50';
                
                html += `
                    <div class="cart-item" style="display: flex; align-items: center; gap: 10px;">
                        <img src="${itemImg}" alt="" style="width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color);" onerror="this.src='https://via.placeholder.com/50'">
                        <div style="flex: 1;">
                            <h4 style="margin:0 0 4px 0; font-size:13px; color:var(--text-color);">${item.title}</h4>
                            <div style="font-size:12px; color:var(--accent-gold); font-weight:bold;">₹${item.price} x ${item.qty} = ₹${itemTotal}</div>
                        </div>
                        <div class="qty-controls" style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span style="font-size:12px; font-weight:bold; color:var(--text-color); min-width:14px; text-align:center;">${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                            <button onclick="removeItem(${index})" style="background:transparent; border:none; color:#ff4d4d; cursor:pointer; font-size:12px;"><i class="fa-solid fa-trash"></i> Remove</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cartSubtotal').innerText = '₹' + subtotal;
        }

        function changeQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            if (cart[index]) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            localStorage.setItem('novaCart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('novaCart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + Number(item.qty), 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        function directOrder(title, price, image) {
            const buyNowItem = [{
                title: title,
                price: price,
                image: image,
                qty: 1
            }];
            localStorage.setItem('novaCart', JSON.stringify(buyNowItem));
            window.location.href = 'checkout.html';
        }

        function proceedToCheckout() {
            let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = 'checkout.html';
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productGrid');
            const cards = grid.getElementsByClassName('product-card');

            for (let i = 0; i < cards.length; i++) {
                const titleElement = cards[i].querySelector('.product-title');
                if (titleElement) {
                    const title = titleElement.innerText.toLowerCase();
                    if (title.includes(query)) {
                        cards[i].style.display = "";
                    } else {
                        cards[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
