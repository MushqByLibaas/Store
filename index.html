<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Store | Premium Ladies Suits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="top-announcement">
            📌 NO EXCHANGE / NO RETURN / NO CANCELLATION | Pan India Delivery
        </div>
        <div class="main-header">
            <div class="menu-icon">&#9776;</div>
            <div class="brand-title">Nova Store</div>
            <div class="header-icons">
                <span>&#128269;</span>
                <span>&#128722;</span>
            </div>
        </div>
        <div class="hero-banner">
            <h2>Nova Store Designer Wear</h2>
            <p>LUXURY & HIGH QUALITY | 100% ORIGINAL</p>
        </div>
    </header>

    <main>
        <section class="products-section">
            <h2 class="section-title">NEW ARRIVALS</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products will load dynamically -->
            </div>
        </section>

        <section class="checkout-section">
            <h2>Complete Your Order</h2>
            <form id="orderForm">
                <label for="custName">Full Name:</label>
                <input type="text" id="custName" required placeholder="Enter your full name">

                <label for="custPhone">WhatsApp Number:</label>
                <input type="tel" id="custPhone" required placeholder="Enter 10-digit mobile number">

                <label for="custAddress">Delivery Address:</label>
                <textarea id="custAddress" required placeholder="House no, Street, Landmark, City, Pincode"></textarea>

                <label for="custLocation">Select Location / Area:</label>
                <input type="text" id="custLocation" placeholder="Enter your city or area location">

                <button type="submit" id="orderNowBtn">Order Now</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
