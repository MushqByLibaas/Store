<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Mushq By Libaas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--accent-gold); text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        ✨ PREPAID ORDERS ONLY | Pan India Delivery ✨
    </div>

    <header class="header">
        <a href="index.html" class="logo">MUSHQ BY <span>LIBAAS</span></a>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 20px;">
        <h2 class="section-title">Checkout Details</h2>
        
        <form id="checkoutForm" onsubmit="openPaymentModal(event)" style="background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
            
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">Full Name</label>
                <input type="text" id="custName" required placeholder="Enter your full name" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">WhatsApp Number</label>
                <input type="tel" id="custPhone" required placeholder="Enter WhatsApp number" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">Delivery Address</label>
                <textarea id="custAddress" required rows="3" placeholder="House no, street, landmark, city, pincode" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;"></textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">GPS Location Pin</label>
                <button type="button" onclick="getLocation()" style="background:#333; color:#fff; border:1px solid var(--accent-gold); padding:10px; width:100%; border-radius:6px; cursor:pointer; font-size:13px;">
                    <i class="fa-solid fa-location-dot" style="color:var(--accent-gold);"></i> Fetch My Current Location
                </button>
                <p id="locationStatus" style="font-size:12px; color:var(--accent-gold); margin-top:6px;"></p>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-bottom: 20px;">
                <h4 style="color:var(--accent-gold); margin-bottom:10px;">Order Summary</h4>
                <div id="checkoutSummary" style="font-size:14px; color:#ddd;">Loading items...</div>
            </div>

            <button type="submit" id="orderBtn" style="width:100%; background:var(--accent-gold); color:#000; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer; text-transform:uppercase;">
                Proceed to Payment
            </button>
        </form>
    </div>

    <!-- PAYMENT MODAL POPUP -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-gold); margin-top:0;">Scan & Pay via PhonePe</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 8px;">Scan QR or click below to pay via UPI app.</p>
            
            <img src="qr.jpg" alt="Payment QR" style="width:160px; height:160px; border-radius:8px; border:2px solid var(--accent-gold); background:#fff; padding:4px; margin-bottom:8px;">
            
            <div id="modalAmount" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 10px;">Amount to Pay: ₹0</div>

            <a id="upiPayLink" href="#" style="display:block; background:#28a745; color:#fff; text-decoration:none; padding:10px; font-weight:bold; border-radius:6px; margin-bottom:8px; font-size:14px;">
                <i class="fa-solid fa-mobile-screen-button"></i> Pay via GPay / PhonePe / Paytm
            </a>

            <button onclick="submitFinalOrder()" style="width:100%; background:var(--accent-gold); color:#000; border:none; padding:12px; font-weight:bold; border-radius:6px; cursor:pointer; margin-bottom:6px; text-transform:uppercase;">
                <i class="fa-solid fa-circle-check"></i> I Have Paid - Submit Order
            </button>
            <button onclick="closeModal()" style="width:100%; background:#333; color:#fff; border:none; padding:6px; border-radius:6px; cursor:pointer; font-size:12px;">
                Cancel
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCQU5IqB0wStcqvnetheOcv2oVnD-RoXw",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.firebasestorage.app",
            messagingSenderId: "1057698747540",
            appId: "1:1057698747540:web:e68337039fcb254f381081",
            measurementId: "G-J1L758MD9G"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let lat = "";
        let lng = "";
        let finalTotal = 0;
        let customerData = {};

        document.addEventListener("DOMContentLoaded", () => {
            const summaryDiv = document.getElementById('checkoutSummary');
            let cart = [];
            
            try {
                cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            } catch (err) {
                cart = [];
            }
            
            if (cart.length === 0) {
                summaryDiv.innerHTML = '<p style="color:red;">No product selected! Please go back and click Order Now again.</p>';
                return;
            }

            let html = '<ul style="padding-left:15px; margin:0;">';
            cart.forEach(item => {
                finalTotal += Number(item.price) * Number(item.qty);
                html += `<li style="margin-bottom:5px;">${item.title} (Qty: ${item.qty}) - ₹${item.price * item.qty}</li>`;
            });
            html += `</ul><div style="margin-top:10px; font-weight:bold; color:var(--accent-gold);">Total Amount: ₹${finalTotal}</div>`;
            summaryDiv.innerHTML = html;
        });

        function getLocation() {
            const status = document.getElementById('locationStatus');
            if (navigator.geolocation) {
                status.innerText = "Fetching location...";
                navigator.geolocation.getCurrentPosition((position) => {
                    lat = position.coords.latitude;
                    lng = position.coords.longitude;
                    status.innerText = `Location captured!`;
                }, (error) => {
                    status.innerText = "Unable to retrieve location. Address is sufficient.";
                });
            } else {
                status.innerText = "Geolocation not supported.";
            }
        }

        function openPaymentModal(e) {
            e.preventDefault();
            customerData = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddress').value
            };

            if (finalTotal <= 0) {
                alert("Invalid total amount. Please re-select the product.");
                return;
            }

            document.getElementById('modalAmount').innerText = "Amount to Pay: ₹" + finalTotal;
            
            const merchantUpiID = "mushq@paytm"; 
            document.getElementById('upiPayLink').href = `upi://pay?pa=${merchantUpiID}&pn=MushqByLibaas&am=${finalTotal}&cu=INR`;

            document.getElementById('paymentModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function submitFinalOrder() {
            const cartItems = JSON.parse(localStorage.getItem('novaCart')) || [];

            db.collection("orders").add({
                customerName: customerData.name,
                phone: customerData.phone,
                address: customerData.address,
                location: { latitude: lat || 'Not shared', longitude: lng || 'Not shared' },
                items: cartItems,
                totalAmount: finalTotal,
                paymentStatus: "Pending Verification",
                status: "Pending Confirmation",
                orderDate: new Date().toLocaleString()
            })
            .then(() => {
                localStorage.removeItem('novaCart');
                window.location.href = 'success.html';
            })
            .catch((error) => {
                alert("Error: " + error.message);
            });
        }
    </script>
</body>
</html>
