<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nova Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase App (compat) and Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        ✨ NO EXCHANGE / NO RETURN / NO CANCELLATION | Pan India Delivery ✨
    </div>

    <header class="header">
        <a href="index.html" class="logo">NOVA <span>STORE</span></a>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 20px;">
        <h2 class="section-title">Checkout Details</h2>
        
        <form id="checkoutForm" onsubmit="submitOrder(event)" style="background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
            
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">Full Name</label>
                <input type="text" id="custName" required placeholder="Enter your full name" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">WhatsApp Number</label>
                <input type="tel" id="custPhone" required placeholder="Enter WhatsApp number" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">Delivery Address</label>
                <textarea id="custAddress" required rows="3" placeholder="House no, street, landmark, city, pincode" style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; box-sizing:border-box;"></textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-size:13px; color:var(--text-muted);">GPS Location Pin</label>
                <button type="button" onclick="getLocation()" style="background:#333; color:#fff; border:1px solid var(--accent-gold); padding:10px; width:100%; border-radius:6px; cursor:pointer; font-size:13px;">
                    <i class="fa-solid fa-location-dot" style="color:var(--accent-gold);"></i> Fetch My Current Location
                </button>
                <p id="locationStatus" style="font-size:12px; color:var(--accent-gold); margin-top:6px;"></p>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-bottom: 20px;">
                <h4 style="color:var(--accent-gold); margin-bottom:10px;">Order Summary</h4>
                <div id="checkoutSummary" style="font-size:14px; color:#ddd;">Loading items...</div>
            </div>

            <button type="submit" id="orderBtn" style="width:100%; background:var(--accent-gold); color:#000; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer; text-transform:uppercase;">
                Place Order Now
            </button>
        </form>
    </div>

    <!-- Firebase Configuration & Logic Script -->
    <script>
        // Your Firebase Configuration (Aapke project ke credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR_API_KEY_HERE",
            authDomain: "mushqbylibaas.firebaseapp.com",
            projectId: "mushqbylibaas",
            storageBucket: "mushqbylibaas.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let lat = "";
        let lng = "";

        // Load Cart Summary on page load
        document.addEventListener("DOMContentLoaded", () => {
            const cart = JSON.parse(localStorage.getItem('novaCart')) || [];
            const summaryDiv = document.getElementById('checkoutSummary');
            
            if (cart.length === 0) {
                summaryDiv.innerHTML = "Your cart is empty.";
                return;
            }

            let html = '<ul style="padding-left:15px; margin:0;">';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                html += `<li style="margin-bottom:5px;">${item.title} (Qty: ${item.qty}) - ₹${item.price * item.qty}</li>`;
            });
            html += `</ul><div style="margin-top:10px; font-weight:bold; color:var(--accent-gold);">Total Amount: ₹${total}</div>`;
            summaryDiv.innerHTML = html;
        });

        // Get GPS Location function
        function getLocation() {
            const status = document.getElementById('locationStatus');
            if (navigator.geolocation) {
                status.innerText = "Fetching location...";
                navigator.geolocation.getCurrentPosition((position) => {
                    lat = position.coords.latitude;
                    lng = position.coords.longitude;
                    status.innerText = `Location captured successfully! (Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)})`;
                }, (error) => {
                    status.innerText = "Unable to retrieve your location. Please type address clearly.";
                });
            } else {
                status.innerText = "Geolocation is not supported by your browser.";
            }
        }

        // Submit Order to Firebase Firestore
        function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('orderBtn');
            btn.innerText = "Placing Order...";
            btn.disabled = true;

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const cartItems = JSON.parse(localStorage.getItem('novaCart')) || [];

            const totalAmount = cartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);

            db.collection("orders").add({
                customerName: name,
                phone: phone,
                address: address,
                location: { latitude: lat || 'Not shared', longitude: lng || 'Not shared' },
                items: cartItems,
                totalAmount: totalAmount,
                orderDate: new Date().toLocaleString()
            })
            .then(() => {
                alert("Order placed successfully!");
                localStorage.removeItem('novaCart');
                window.location.href = 'index.html';
            })
            .catch((error) => {
                alert("Error placing order: " + error.message);
                btn.innerText = "Place Order Now";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
