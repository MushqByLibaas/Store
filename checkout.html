<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushq Libaas | Secure Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container { max-width: 800px; margin: 40px auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .checkout-title { font-family: 'Cinzel', serif; color: var(--accent-gold); font-size: 24px; margin-bottom: 25px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-gold); }
        .location-btn { background: #222; border: 1px dashed var(--accent-gold); color: var(--accent-gold); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .location-btn:hover { background: #333; }
        .order-summary-box { background: #111; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .order-summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .order-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: var(--accent-gold); border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 10px; }
        .place-order-btn { background: #25d366; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .place-order-btn:hover { background: #20ba5a; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">MUSHQ <span>LIBAAS</span></a>
        <a href="index.html" style="color: var(--accent-gold); text-decoration: none; font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
    </header>

    <div class="container">
        <div class="checkout-container">
            <h2 class="checkout-title"><i class="fa-solid fa-bag-shopping"></i> Complete Your Order</h2>
            
            <div class="order-summary-box">
                <h4 style="color: var(--accent-gold); margin-bottom: 15px; font-family: 'Cinzel', serif;">Order Summary</h4>
                <div id="checkoutItemsList"></div>
                <div class="order-total-row">
                    <span>Total Amount:</span>
                    <span>₹<span id="checkoutTotalAmount">0</span></span>
                </div>
            </div>

            <form id="checkoutForm" onsubmit="submitOrderToWhatsApp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="cust-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>WhatsApp Phone Number</label>
                    <input type="tel" id="cust-phone" placeholder="Enter 10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="cust-address" rows="3" placeholder="House no, Street, Landmark, City, Pincode" required></textarea>
                </div>

                <div class="form-group">
                    <label>GPS Location Pin</label>
                    <button type="button" class="location-btn" onclick="getLocationPin()"><i class="fa-solid fa-location-dot"></i> Get My Current GPS Location</button>
                    <input type="text" id="cust-location" placeholder="Google Maps link will appear here" style="margin-top: 8px;" readonly required>
                </div>

                <button type="submit" class="place-order-btn"><i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> Order via WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('nova_cart')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            renderCheckoutSummary();
        });

        function renderCheckoutSummary() {
            const listEl = document.getElementById('checkoutItemsList');
            const totalEl = document.getElementById('checkoutTotalAmount');
            
            if(!cart || cart.length === 0) {
                listEl.innerHTML = '<p style="color:#888;">No items in cart.</p>';
                totalEl.innerText = '0';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                const qty = item.quantity || 1;
                total += item.price * qty;
                html += `
                    <div class="order-summary-row">
                        <span>${item.title} × ${qty}</span>
                        <span style="color: var(--accent-gold);">₹${item.price * qty}</span>
                    </div>
                `;
            });

            listEl.innerHTML = html;
            totalEl.innerText = total;
        }

        function getLocationPin() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                    document.getElementById('cust-location').value = mapsLink;
                    alert("Location captured successfully!");
                }, error => {
                    alert("Unable to retrieve your location. Please ensure GPS is enabled.");
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function submitOrderToWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const location = document.getElementById('cust-location').value;

            if(!cart || cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            let totalAmount = 0;
            let itemsText = "";
            cart.forEach((item, index) => {
                const qty = item.quantity || 1;
                totalAmount += item.price * qty;
                itemsText += `%0A${index + 1}. *${item.title}* (Qty: ${qty}) - ₹${item.price * qty}`;
            });

            // Yahan apna WhatsApp number daal dein (Country code ke sath, jaise 919876543210)
            const ownerWhatsAppNumber = "919876543210"; 

            const whatsappMessage = `*New Order Received! - Mushq Libaas*%0A` +
                                    `-----------------------------------%0A` +
                                    `*Customer Name:* ${name}%0A` +
                                    `*Phone:* ${phone}%0A` +
                                    `*Address:* ${address}%0A` +
                                    `*Location Map:* ${location}%0A` +
                                    `-----------------------------------%0A` +
                                    `*Products:* ${itemsText}%0A` +
                                    `-----------------------------------%0A` +
                                    `*Total Amount:* ₹${totalAmount}%0A` +
                                    `-----------------------------------`;

            localStorage.removeItem('nova_cart');
            window.location.href = `https://wa.me/${ownerWhatsAppNumber}?text=${whatsappMessage}`;
        }
    </script>
</body>
</html>
